# Copy this file into a consuming repo's .github/workflows/ directory.
# Adjust the allowed-users list, bypass-label, and required-commit-statuses to match your setup.

name: PR Auto-Bypass

on:
  pull_request_target:
    types: [labeled]

permissions:
  actions: write
  checks: write
  pull-requests: write
  contents: write
  statuses: write

jobs:
  bypass:
    runs-on: ubuntu-latest
    # IMPORTANT: Do NOT add this job's name ("bypass") to the repo's required branch protection
    # checks. This job is in_progress while it runs the merge — if it were a required check,
    # the PR would be permanently blocked waiting for itself to finish. The action overrides
    # all OTHER required checks; this job should be allowed to run unrestricted.
    #
    # Skip the job entirely unless all conditions are met. The label check must be on the label that was
    # just added (github.event.label), not just its presence — otherwise adding any other label would
    # re-trigger the bypass.
    # Keep these values in sync with the action inputs below.
    if: >-
      contains(fromJSON('["brianseeders"]'), github.event.pull_request.user.login) &&
      github.event.label.name == 'auto-merge-bypass' &&
      contains(fromJSON('["brianseeders"]'), github.event.sender.login)
    steps:
      - uses: elastic/es-pr-bypass@main
        with:
          # GITHUB_TOKEN covers checks:write, pull-requests:write, contents:write
          token: ${{ secrets.GITHUB_TOKEN }}

          # Optional: a separate PAT or App token used as the approver identity.
          # If omitted, the action approves with GITHUB_TOKEN (may not satisfy
          # branch protection rules that require a human approval).
          approve-token: ${{ secrets.PR_BYPASS_APPROVE_TOKEN }}

          # Must match the fromJSON list in the if: condition above
          allowed-users: 'brianseeders'

          # Users permitted to add the bypass label. Defaults to allowed-users if omitted.
          # Must match the sender fromJSON list in the if: condition above
          allowed-labelers: 'brianseeders'

          # Must match the label name in the if: condition above
          bypass-label: 'auto-merge-bypass'

          # Commit status contexts to explicitly mark successful.
          # These are created even if they haven't run yet.
          # Non-successful check runs and commit statuses are overridden automatically.
          required-commit-statuses: 'test-check'

          # merge, squash, or rebase
          merge-method: 'squash'
